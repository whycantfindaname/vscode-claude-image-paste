name: Publish

# Fires when a GitHub Release is published as the latest (non-draft, non-prerelease).
# Can also be run manually against the default branch.
on:
  release:
    types: [released]
  workflow_dispatch:

permissions:
  contents: write # needed to attach the .vsix to the release

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag matches package.json version
        if: github.event_name == 'release'
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG="${{ github.event.release.tag_name }}"
          TAG_VERSION="${TAG#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Release tag ($TAG_VERSION) does not match package.json version ($PKG_VERSION). Bump package.json before tagging."
            exit 1
          fi
          echo "Version $PKG_VERSION matches tag $TAG."

      - name: Compile
        run: npm run compile

      - name: Package .vsix
        run: |
          npx --yes @vscode/vsce package --no-dependencies -o extension.vsix
          ls -la extension.vsix

      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npx --yes @vscode/vsce publish --no-dependencies --packagePath extension.vsix -p "$VSCE_PAT"

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: |
          # create-namespace is a one-time op; ignore "already exists" on reruns.
          npx --yes ovsx create-namespace benjaminwood -p "$OVSX_PAT" || true
          npx --yes ovsx publish extension.vsix -p "$OVSX_PAT"

      - name: Attach .vsix to the GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" extension.vsix --clobber
